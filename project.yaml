version: '5.0'

actions:


  #WP2.1
  generate_dataset_wp2_1:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_wp2_1.py --output output/tmp_dataset_wp2_1.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/tmp_dataset_wp2_1.csv.gz


  diabetes_algo_wp2_1:
    run: diabetes-algo:v0.0.6 --output output/dataset_wp2_1.csv.gz
    config:
      df_input: tmp_dataset_wp2_1.csv.gz
      birth_date: dob
      ethnicity_cat: ethnicity_cat
      df_output: dataset_wp2_1.csv.gz
    needs:
      - generate_dataset_wp2_1
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp2_1.csv.gz

  #WP2.2
  generate_dataset_wp2_2:
    run: ehrql:v1 generate-dataset analysis/dataset_definition/dataset_definition_wp2_2.py --output output/tmp_dataset_wp2_2.csv.gz
    outputs:
      highly_sensitive:
        dataset: output/tmp_dataset_wp2_2.csv.gz


  diabetes_algo_wp2_2:
    run: diabetes-algo:v0.0.6 --output output/dataset_wp2_2.csv.gz
    config:
      df_input: tmp_dataset_wp2_2.csv.gz
      birth_date: dob
      ethnicity_cat: ethnicity_cat
      df_output: dataset_wp2_2.csv.gz
    needs:
      - generate_dataset_wp2_2
    outputs:
      highly_sensitive:
        dataset: output/dataset_wp2_2.csv.gz
